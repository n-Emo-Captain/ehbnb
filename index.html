<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ehbnb.com - 4Balance Homestay</title>
  
  <!-- Google Font: Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .scratch-block {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      cursor: grab;
      user-select: none;
      transition: all 0.15s ease;
    }
    .scratch-block:active {
      cursor: grabbing;
      background-color: #e2e8f0;
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden relative bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxDCrgayM9o_Q4UnZ2JwcBfoisVapls_3loCM81kMt4gri8peztk95DbIQXmI8rSVLIg/exec";
    const DRIVE_FOLDER_URL = "https://drive.google.com/drive/folders/1CInoi1H1tQWkf5UYdcVzQRN9DCm_XX79?usp=drive_link";
    const ADMIN_PIN = "1234";

    const formatTimeDisplay = (timeVal) => {
      if (!timeVal) return '';
      if (typeof timeVal === 'string' && timeVal.includes('T')) {
        try {
          const d = new Date(timeVal);
          if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
        } catch(e) {}
      }
      return timeVal;
    };

    // --- 1. Home / Address Submission Component ---
    const AddressForm = ({ autoEmail }) => {
      const [fullName, setFullName] = useState('');
      const [address, setAddress] = useState('');
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [warningMsg, setWarningMsg] = useState('');

      const startsWithCapital = (str) => {
        if (!str || str.trim().length === 0) return false;
        const firstChar = str.trim().charAt(0);
        return firstChar === firstChar.toUpperCase() && firstChar !== firstChar.toLowerCase();
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setWarningMsg('');

        const isNameCapitalized = startsWithCapital(fullName);
        const isAddressCapitalized = startsWithCapital(address);

        if (!isNameCapitalized || !isAddressCapitalized) {
          let error = "Capitalization warning: ";
          if (!isNameCapitalized && !isAddressCapitalized) {
            error += "The first letter of both Full Name and Pickup Address must be capitalized (e.g. Lim Zhi Ying and Ehsan Ria).";
          } else if (!isNameCapitalized) {
            error += "The first letter of Full Name must be capitalized (e.g. Lim Zhi Ying).";
          } else {
            error += "The first letter of Pickup Address must be capitalized (e.g. Ehsan Ria).";
          }
          setWarningMsg(error);
          return;
        }

        setLoading(true);

        const payload = JSON.stringify({
          action: "submitAddress",
          email: autoEmail,
          fullName: fullName.trim(),
          address: address.trim()
        });

        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: payload
          });
          
          setLoading(false);
          setSubmitted(true);
        } catch (err) {
          console.error(err);
          alert("Submission failed. Please check network connection.");
          setLoading(false);
        }
      };

      return (
        <div class="space-y-5">
          <div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">Submit Pickup Address</h2>
            <p class="text-xs text-slate-500">Submitting with an existing Full Name will overwrite your previous entry.</p>
          </div>

          {warningMsg && (
            <div class="bg-red-50 border border-red-200 p-4 rounded-xl text-red-700 text-xs font-medium space-y-1">
              <p class="uppercase text-[10px] tracking-wider font-bold text-red-800">⚠️ Action Required</p>
              <p>{warningMsg}</p>
            </div>
          )}

          {submitted ? (
            <div class="bg-blue-50 border border-blue-200 p-5 rounded-xl space-y-2">
              <h3 class="text-sm font-bold text-blue-700">✓ Address Submitted / Overwritten</h3>
              <p class="text-xs text-slate-700">Your row matching "<strong>{fullName}</strong>" in Google Sheets has been updated.</p>
              <button onClick={() => setSubmitted(false)} class="text-xs text-blue-600 font-semibold underline mt-2 block">
                Edit address or submit another
              </button>
            </div>
          ) : (
            <form class="space-y-4" onSubmit={handleSubmit}>
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Full Name</label>
                <input 
                  required 
                  value={fullName} 
                  onChange={(e) => setFullName(e.target.value)} 
                  type="text" 
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs text-slate-900 focus:border-blue-600 focus:bg-white outline-none transition" 
                  placeholder="Lim Zhi Ying" 
                />
                <span class="text-[10px] text-slate-400 mt-0.5 block">Example: Lim Zhi Ying</span>
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Pickup Address</label>
                <textarea 
                  required 
                  value={address} 
                  onChange={(e) => setAddress(e.target.value)} 
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs text-slate-900 focus:border-blue-600 focus:bg-white outline-none h-24 transition" 
                  placeholder="Ehsan Ria"
                ></textarea>
                <span class="text-[10px] text-slate-400 mt-0.5 block">Example: Ehsan Ria</span>
              </div>

              <button 
                disabled={loading} 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-150 text-xs tracking-wide disabled:opacity-50 shadow-sm"
              >
                {loading ? "Saving to Spreadsheet..." : "Submit Address"}
              </button>
            </form>
          )}
        </div>
      );
    };

    // --- 2. Live Agenda Component ---
    const AgendaView = () => {
      const [agendaItems, setAgendaItems] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`${APPS_SCRIPT_URL}?action=getAgenda`)
          .then((res) => res.json())
          .then((data) => {
            if (Array.isArray(data) && data.length > 0) {
              setAgendaItems(data);
            }
            setLoading(false);
          })
          .catch((err) => {
            console.error("Failed to fetch agenda:", err);
            setLoading(false);
          });
      }, []);

      return (
        <div class="space-y-4">
          <div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">Trip Agenda</h2>
            <p class="text-xs text-slate-500">Live schedule from master spreadsheet</p>
          </div>

          {loading ? (
            <div class="p-6 text-center text-xs text-slate-400">Loading agenda...</div>
          ) : agendaItems.length > 0 ? (
            <div class="space-y-3">
              {agendaItems.map((item, index) => {
                const isDay2 = item.day && item.day.toString().toLowerCase().includes('2');
                return (
                  <div 
                    key={index} 
                    class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm"
                  >
                    <div class="flex justify-between items-center mb-1">
                      <span class={`inline-block text-[11px] font-semibold px-2 py-0.5 rounded ${
                        isDay2 
                          ? 'bg-slate-100 text-slate-800 border border-slate-200' 
                          : 'bg-blue-50 text-blue-700 border border-blue-200'
                      }`}>
                        {item.day || 'Day 1'} {item.time ? `• ${formatTimeDisplay(item.time)}` : ''}
                      </span>
                      <span class="text-[10px] font-semibold text-slate-400 uppercase">{item.status || 'Confirmed'}</span>
                    </div>
                    {item.activity && <h3 class="text-sm font-bold text-slate-900 mt-1">{item.activity}</h3>}
                    {item.details && <p class="text-xs text-slate-600 mt-0.5">{item.details}</p>}
                  </div>
                );
              })}
            </div>
          ) : (
            <div class="p-4 text-center text-xs text-slate-400">No agenda items found.</div>
          )}
        </div>
      );
    };

    // --- 3. Transportation Component (Clean Guest View vs Admin View) ---
    const TransportView = ({ isAdmin }) => {
      const [participants, setParticipants] = useState([]);
      const [addressMap, setAddressMap] = useState({});
      const [cars, setCars] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [draggedName, setDraggedName] = useState(null);
      const [customStopInputs, setCustomStopInputs] = useState({});

      const loadData = () => {
        setLoading(true);
        fetch(`${APPS_SCRIPT_URL}?action=getTransportData`)
          .then((res) => res.json())
          .then((data) => {
            setParticipants(data.participants || []);
            setAddressMap(data.addressMap || {});
            
            const cleanedCars = (data.cars || []).map((c) => ({
              ...c,
              departureTime: formatTimeDisplay(c.departureTime)
            }));
            setCars(cleanedCars);
            setLoading(false);
          })
          .catch((err) => {
            console.error(err);
            setLoading(false);
          });
      };

      useEffect(() => {
        loadData();
      }, []);

      const toggleDriver = (personName) => {
        const isCurrentlyDriver = cars.some((c) => c.driver === personName);

        if (isCurrentlyDriver) {
          const updatedCars = cars.filter((c) => c.driver !== personName);
          setCars(updatedCars);
        } else {
          const newCarId = `Car 0${cars.length + 1}`;
          const newCar = {
            carId: newCarId,
            driver: personName,
            departureTime: '01:30 PM',
            pickupRoute: 'Homestay',
            passengers: [],
            status: 'Confirmed'
          };
          const updatedCars = cars.map((c) => ({
            ...c,
            passengers: (c.passengers || []).filter((p) => p !== personName)
          }));
          setCars([...updatedCars, newCar]);
        }
      };

      const driverNames = cars.map((c) => c.driver);
      const assignedPassengerNames = cars.flatMap((c) => c.passengers || []);
      const unassignedPassengers = participants.filter(
        (p) => !driverNames.includes(p) && !assignedPassengerNames.includes(p)
      );

      const assignToCar = (passengerName, carIndex) => {
        const updatedCars = cars.map((car, idx) => {
          const cleaned = (car.passengers || []).filter((p) => p !== passengerName);
          if (idx === carIndex) {
            return { ...car, passengers: [...cleaned, passengerName] };
          }
          return { ...car, passengers: cleaned };
        });
        setCars(updatedCars);
      };

      const unassignPassenger = (passengerName) => {
        const updatedCars = cars.map((car) => ({
          ...car,
          passengers: (car.passengers || []).filter((p) => p !== passengerName)
        }));
        setCars(updatedCars);
      };

      const parseRouteStops = (routeStr) => {
        if (!routeStr) return [];
        return routeStr.split(' ➔ ').map((s) => s.trim()).filter(Boolean);
      };

      const updateRouteFromStops = (carIdx, stopsArray) => {
        const newRouteStr = stopsArray.join(' ➔ ');
        setCars(cars.map((c, idx) => idx === carIdx ? { ...c, pickupRoute: newRouteStr } : c));
      };

      const appendStopToCar = (carIdx, stopName) => {
        if (!stopName) return;
        const currentStops = parseRouteStops(cars[carIdx].pickupRoute);
        const homestayIdx = currentStops.indexOf('Homestay');
        
        if (homestayIdx !== -1) {
          currentStops.splice(homestayIdx, 0, stopName);
        } else {
          currentStops.push(stopName);
          currentStops.push('Homestay');
        }
        updateRouteFromStops(carIdx, currentStops);
      };

      const removeStopFromCar = (carIdx, stopIdx) => {
        const currentStops = parseRouteStops(cars[carIdx].pickupRoute);
        currentStops.splice(stopIdx, 1);
        updateRouteFromStops(carIdx, currentStops);
      };

      const moveStopInCar = (carIdx, stopIdx, direction) => {
        const currentStops = parseRouteStops(cars[carIdx].pickupRoute);
        const targetIdx = stopIdx + direction;
        if (targetIdx < 0 || targetIdx >= currentStops.length) return;
        
        const temp = currentStops[stopIdx];
        currentStops[stopIdx] = currentStops[targetIdx];
        currentStops[targetIdx] = temp;
        updateRouteFromStops(carIdx, currentStops);
      };

      const saveToSheet = async () => {
        setSaving(true);
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateTransport",
              cars: cars
            })
          });
          alert("Transportation details synced to Google Sheets!");
          setSaving(false);
        } catch (err) {
          console.error(err);
          alert("Failed to save to spreadsheet.");
          setSaving(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="text-xl font-bold text-slate-900 mb-1">Car & Transport Arrangements</h2>
              <p class="text-xs text-slate-500">
                {isAdmin ? "Admin Controls: Select drivers, assign passengers, and edit pickup routes." : "Departure times, driver info, and passenger routes."}
              </p>
            </div>
            {isAdmin && (
              <button 
                onClick={saveToSheet} 
                disabled={saving || loading}
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3.5 py-2 rounded-lg text-xs transition shadow-sm disabled:opacity-50"
              >
                {saving ? "Syncing..." : "Save & Sync to Sheet"}
              </button>
            )}
          </div>

          {loading ? (
            <div class="p-6 text-center text-xs text-slate-400">Loading transport data...</div>
          ) : !isAdmin ? (
            /* --- CLEAN GUEST READ-ONLY VIEW --- */
            <div class="space-y-4">
              {cars.length === 0 ? (
                <div class="p-4 text-center text-xs text-slate-400">No cars arranged yet.</div>
              ) : (
                cars.map((car, idx) => {
                  const routeStops = parseRouteStops(car.pickupRoute);
                  return (
                    <div key={idx} class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
                      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                        <div>
                          <span class="text-[10px] font-bold text-blue-600 uppercase tracking-wider">{car.carId}</span>
                          <h3 class="text-sm font-bold text-slate-900">Driver: {car.driver}</h3>
                        </div>
                        <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded border border-blue-200">
                          🕒 Departs: {car.departureTime || '01:30 PM'}
                        </span>
                      </div>

                      {/* Route Sequence */}
                      <div class="space-y-1">
                        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">📍 Pickup Route Sequence:</span>
                        <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-800 font-medium">
                          {routeStops.length > 0 ? (
                            routeStops.map((stop, sIdx) => (
                              <React.Fragment key={sIdx}>
                                <span class="bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-md text-xs font-semibold">
                                  {stop}
                                </span>
                                {sIdx < routeStops.length - 1 && <span class="text-slate-400 font-bold">➔</span>}
                              </React.Fragment>
                            ))
                          ) : (
                            <span class="text-slate-400 italic">Direct to Homestay</span>
                          )}
                        </div>
                      </div>

                      {/* Passengers */}
                      <div class="space-y-1 pt-1">
                        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">👥 Passengers ({car.passengers ? car.passengers.length : 0}):</span>
                        <div class="flex flex-wrap gap-1.5">
                          {car.passengers && car.passengers.length > 0 ? (
                            car.passengers.map((p, pIdx) => (
                              <span key={pIdx} class="bg-slate-100 text-slate-800 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200">
                                {p}
                              </span>
                            ))
                          ) : (
                            <span class="text-xs text-slate-400 italic">No passengers assigned</span>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          ) : (
            /* --- ADMIN EDITING VIEW --- */
            <div class="space-y-6">
              {/* Driver Selection */}
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-700 block">
                  🚗 Choose Drivers (Tick / Untick):
                </span>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {participants.map((person, idx) => {
                    const isDriver = driverNames.includes(person);
                    return (
                      <label key={idx} class={`flex items-center gap-2 p-2 rounded-lg border text-xs font-semibold cursor-pointer transition ${isDriver ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-100'}`}>
                        <input type="checkbox" checked={isDriver} onChange={() => toggleDriver(person)} class="w-3.5 h-3.5 accent-blue-600 cursor-pointer" />
                        <span class="truncate">{person} {isDriver ? '(Driver)' : ''}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {/* Unassigned Passenger Blocks */}
              <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 block mb-2">
                  🧩 Unassigned Passenger Blocks ({unassignedPassengers.length})
                </span>
                <div class="flex flex-wrap gap-2">
                  {unassignedPassengers.map((name, i) => (
                    <div key={i} draggable onDragStart={() => setDraggedName(name)} class="scratch-block px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-800 flex items-center gap-2 shadow-sm">
                      <span>⋮⋮ {name}</span>
                      <select onChange={(e) => e.target.value !== "" && assignToCar(name, parseInt(e.target.value))} class="bg-slate-800 text-white text-[10px] rounded px-1.5 py-0.5 outline-none font-semibold cursor-pointer" defaultValue="">
                        <option value="" disabled>+ Car</option>
                        {cars.map((c, cIdx) => <option key={cIdx} value={cIdx}>{c.driver}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>

              {/* Driver Car Cards */}
              <div class="space-y-4">
                {cars.map((car, carIdx) => {
                  const carPeople = [car.driver, ...(car.passengers || [])].filter(Boolean);
                  const routeStops = parseRouteStops(car.pickupRoute);
                  return (
                    <div key={carIdx} onDragOver={(e) => e.preventDefault()} onDrop={() => draggedName && assignToCar(draggedName, carIdx)} class="bg-white border border-slate-200 rounded-xl p-4 space-y-4 shadow-sm">
                      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                        <div>
                          <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">{car.carId}</span>
                          <h3 class="text-sm font-bold text-slate-900">Driver: {car.driver}</h3>
                        </div>
                        <button onClick={() => toggleDriver(car.driver)} class="bg-red-50 text-red-600 text-[11px] font-semibold px-2.5 py-1 rounded-md border border-red-200">Untick Driver</button>
                      </div>

                      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div>
                          <label class="block text-[11px] font-semibold uppercase text-slate-500 mb-1">Departure Time</label>
                          <input type="text" value={car.departureTime} onChange={(e) => setCars(cars.map((c, idx) => idx === carIdx ? { ...c, departureTime: e.target.value } : c))} class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none" />
                        </div>
                        <div>
                          <label class="block text-[11px] font-semibold uppercase text-slate-500 mb-1">Route Text String</label>
                          <input type="text" value={car.pickupRoute} onChange={(e) => setCars(cars.map((c, idx) => idx === carIdx ? { ...c, pickupRoute: e.target.value } : c))} class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none" />
                        </div>
                      </div>

                      {/* Route Rearranger */}
                      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-3">
                        <div class="flex justify-between items-center">
                          <span class="text-[11px] font-semibold text-slate-600 uppercase">📍 Rearrange Route:</span>
                          <button type="button" onClick={() => updateRouteFromStops(carIdx, ['Homestay'])} class="text-[11px] text-red-600 underline">Reset Route</button>
                        </div>
                        <div class="flex flex-wrap gap-2 items-center">
                          {routeStops.map((stop, sIdx) => (
                            <React.Fragment key={sIdx}>
                              <div class="bg-white border border-slate-300 rounded-lg px-2 py-1 text-xs font-semibold flex items-center gap-1">
                                <span>{stop}</span>
                                {sIdx > 0 && <button type="button" onClick={() => moveStopInCar(carIdx, sIdx, -1)} class="text-blue-600 px-0.5">←</button>}
                                {sIdx < routeStops.length - 1 && <button type="button" onClick={() => moveStopInCar(carIdx, sIdx, 1)} class="text-blue-600 px-0.5">→</button>}
                                <button type="button" onClick={() => removeStopFromCar(carIdx, sIdx)} class="text-red-600 px-0.5">✕</button>
                              </div>
                              {sIdx < routeStops.length - 1 && <span class="text-xs text-slate-400">➔</span>}
                            </React.Fragment>
                          ))}
                        </div>

                        <div class="border-t border-slate-200 pt-2 space-y-1.5">
                          <span class="text-[10px] font-semibold text-slate-500 uppercase block">Add Stops for {car.driver}'s Car:</span>
                          <div class="flex flex-wrap gap-1">
                            {carPeople.map((personName, pIdx) => addressMap[personName] ? (
                              <button key={pIdx} type="button" onClick={() => appendStopToCar(carIdx, `${personName} (${addressMap[personName]})`)} class="bg-white border border-slate-200 rounded px-2 py-0.5 text-[10px] font-medium text-slate-800">+ {personName}</button>
                            ) : null)}
                          </div>
                        </div>
                      </div>

                      {/* Passenger Drop Area */}
                      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 min-h-[50px] space-y-2">

    // --- 4. Receipts and Bills Component (Clean Guest View vs Admin View) ---
    const BillsView = ({ isAdmin }) => {
      const [participants, setParticipants] = useState([]);
      const [bills, setBills] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        fetch(`${APPS_SCRIPT_URL}?action=getBillsData`)
          .then((res) => res.json())
          .then((data) => {
            setParticipants(data.participants || []);
            setBills(data.bills || []);
            setLoading(false);
          })
          .catch((err) => {
            console.error("Failed to load bills:", err);
            setLoading(false);
          });
      }, []);

      const handleBillChange = (index, field, value) => {
        const updated = bills.map((b, idx) => {
          if (idx === index) {
            return { ...b, [field]: value };
          }
          return b;
        });
        setBills(updated);
      };

      const addBillRow = () => {
        const defaultPayer = participants.length > 0 ? participants[0] : 'Lim Zhi Ying';
        setBills([...bills, { item: 'New Expense Item', paidBy: defaultPayer, totalAmount: 0 }]);
      };

      const deleteBillRow = (index) => {
        setBills(bills.filter((_, idx) => idx !== index));
      };

      const saveBillsToSheet = async () => {
        setSaving(true);
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateBills",
              bills: bills
            })
          });
          alert("Bills updated and synced to Google Sheets!");
          setSaving(false);
        } catch (err) {
          console.error(err);
          alert("Failed to save bills.");
          setSaving(false);
        }
      };

      const totalCost = bills.reduce((acc, b) => acc + (parseFloat(b.totalAmount) || 0), 0);
      const paxCount = participants.length > 0 ? participants.length : 1;
      const perPaxTotalShare = totalCost / paxCount;

      const paidMap = {};
      participants.forEach((p) => { paidMap[p] = 0; });
      bills.forEach((b) => {
        const payer = b.paidBy || (participants[0] || 'Lim Zhi Ying');
        const amt = parseFloat(b.totalAmount) || 0;
        paidMap[payer] = (paidMap[payer] || 0) + amt;
      });

      const balances = participants.map((p) => {
        const paid = paidMap[p] || 0;
        const net = paid - perPaxTotalShare;
        return { name: p, paid, net };
      });

      const settlements = [];
      let debtors = balances.filter((b) => b.net < -0.01).map((b) => ({ ...b, owes: Math.abs(b.net) }));
      let creditors = balances.filter((b) => b.net > 0.01).map((b) => ({ ...b, gets: b.net }));

      debtors.forEach((d) => {
        creditors.forEach((c) => {
          if (d.owes > 0.01 && c.gets > 0.01) {
            const transfer = Math.min(d.owes, c.gets);
            settlements.push({ from: d.name, to: c.name, amount: transfer });
            d.owes -= transfer;
            c.gets -= transfer;
          }
        });
      });

      return (
        <div class="space-y-6">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="text-xl font-bold text-slate-900 mb-1">Receipts and Bills</h2>

                onClick={saveBillsToSheet} 
                disabled={saving || loading}
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3.5 py-2 rounded-lg text-xs transition shadow-sm disabled:opacity-50"

                {saving ? "Syncing..." : "Save & Sync Bills"}
              </button>

            <div class="p-6 text-center text-xs text-slate-400">Loading bills...</div>

            <div class="space-y-6">
              
              {/* Itemized Expenses Table */}

                  {isAdmin && (
                    <button onClick={addBillRow} class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-3 py-1 rounded text-xs transition shadow-sm">
                      + Add Expense Item
                    </button>
                  )}
                </div>

                <div class="overflow-x-auto p-2">
                  <table class="w-full text-left text-xs text-slate-800">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] font-semibold tracking-wider">
                      <tr>
                        <th class="p-2.5">Expense Item</th>
                        <th class="p-2.5">Paid Upfront By</th>
                        <th class="p-2.5 text-right">Total (MYR)</th>
                        <th class="p-2.5 text-right">Per Pax ({paxCount} Pax)</th>
                        {isAdmin && <th class="p-2.5 text-center">Action</th>}
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      {bills.length > 0 ? (
                        bills.map((b, idx) => {
                          const itemCost = parseFloat(b.totalAmount) || 0;
                          return (
                            <tr key={idx} class="hover:bg-slate-50">
                              <td class="p-2.5 font-semibold text-slate-900">
                                {isAdmin ? (
                                  <input type="text" value={b.item} onChange={(e) => handleBillChange(idx, 'item', e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded p-1.5 font-semibold text-xs outline-none" />
                                ) : b.item}
                              </td>

                              <td class="p-2.5 font-semibold text-blue-600">
                                {isAdmin ? (
                                  <select value={b.paidBy || (participants[0] || '')} onChange={(e) => handleBillChange(idx, 'paidBy', e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded p-1.5 font-semibold text-xs outline-none cursor-pointer">
                                    {participants.map((person, pIdx) => <option key={pIdx} value={person}>{person}</option>)}

                              </td>

                                  <div class="flex items-center justify-end gap-1">
                                    <span class="font-medium text-slate-400">RM</span>
                                    <input type="number" step="0.01" value={b.totalAmount} onChange={(e) => handleBillChange(idx, 'totalAmount', e.target.value)} class="w-24 bg-slate-50 border border-slate-200 rounded p-1.5 font-bold text-right text-xs outline-none" />
                                  </div>
                                ) : `RM ${itemCost.toFixed(2)}`}
                              </td>

                              <td class="p-2.5 text-right font-medium text-slate-600">
                                RM {(itemCost / paxCount).toFixed(2)}

                              {isAdmin && (

                                  <button onClick={() => deleteBillRow(idx)} class="text-red-600 font-semibold p-1">✕</button>

                        </tr>

                    </tbody>
                    <tfoot class="bg-slate-100 font-bold text-slate-900 border-t border-slate-200">
                      <tr>
                        <td class="p-3 uppercase text-xs" colSpan="2">TOTAL EXPENSES</td>
                        <td class="p-3 text-right">RM {totalCost.toFixed(2)}</td>
                        <td class="p-3 text-right text-xs">RM {perPaxTotalShare.toFixed(2)}</td>
                        {isAdmin && <td></td>}
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              {/* Settlement Summary */}
              <div class="bg-blue-50/50 border border-blue-200 rounded-xl p-4 space-y-3">
                <span class="inline-block bg-blue-600 text-white text-[10px] font-semibold px-2.5 py-1 rounded uppercase tracking-wider">
                  💸 Settlement Summary (Who Pays Who)
                </span>
                
                {settlements.length > 0 ? (
                  <div class="space-y-2 pt-1">
                    {settlements.map((s, idx) => (
                      <div key={idx} class="bg-white border border-slate-200 p-3 rounded-lg flex items-center justify-between text-xs font-semibold shadow-sm">

                        </div>
                        <span class="text-xs font-bold text-blue-600">Pay RM {s.amount.toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p class="text-xs text-slate-500 font-medium italic">Everyone is even or no participants registered yet!</p>
                )}
              </div>

              {/* Individual Balances */}
              <div class="space-y-3">

                          {owes && (

                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>
          )}
        </div>
      );

                    <span class="w-3 h-3 rounded-full bg-slate-200 border border-slate-300"></span>
