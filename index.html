<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ehbnb.com - 4Balance Homestay</title>
  
  <!-- Google Font: Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .scratch-block {
      background-color: #f7f301;
      border: 1.5px solid #000000;
      color: #000000;
      font-weight: 700;
      border-radius: 0.5rem;
      cursor: grab;
      user-select: none;
      transition: all 0.15s ease;
      box-shadow: 2px 2px 0px #000000;
    }
    .scratch-block:active {
      cursor: grabbing;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #000000;
    }

    /* --- Home page motion --- */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.7,.2,1); }
    .reveal-in { opacity: 1; transform: none; }

    .kenburns { animation: kenburns 4s ease-out forwards; }
    @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.06); } }

    .slide-progress { width: 0; animation-name: slideprogress; animation-timing-function: linear; animation-fill-mode: forwards; }
    @keyframes slideprogress { from { width: 0; } to { width: 100%; } }

    .hero-rise { animation: herorise 1.1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes herorise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

    .scroll-cue { transform-origin: top; animation: scrollcue 1.8s ease-in-out infinite; }
    @keyframes scrollcue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

    .hero-empty { background: radial-gradient(ellipse at 20% 20%, #002ce2 0%, transparent 55%), radial-gradient(ellipse at 85% 70%, #0040e4 0%, transparent 50%), #070a17; }

    .page-fade { animation: pagefade 0.45s ease both; }
    @keyframes pagefade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .nav-scroll { scrollbar-width: none; }
    .nav-scroll::-webkit-scrollbar { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .reveal-in { opacity: 1; transform: none; transition: none; }
      .kenburns, .hero-rise, .scroll-cue, .page-fade { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen overflow-x-hidden relative bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxDCrgayM9o_Q4UnZ2JwcBfoisVapls_3loCM81kMt4gri8peztk95DbIQXmI8rSVLIg/exec";
    const DRIVE_FOLDER_URL = "https://drive.google.com/drive/folders/1CInoi1H1tQWkf5UYdcVzQRN9DCm_XX79?usp=drive_link";
    const ADMIN_PIN = "1234";

    const formatTimeDisplay = (timeVal) => {
      if (!timeVal) return '';
      if (typeof timeVal === 'string' && timeVal.includes('T')) {
        try {
          const d = new Date(timeVal);
          if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
        } catch(e) {}
      }
      return timeVal;
    };

    // --- 1. Home / Address Submission Component ---
    const AddressForm = ({ autoEmail }) => {
      const [fullName, setFullName] = useState('');
      const [address, setAddress] = useState('');
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [warningMsg, setWarningMsg] = useState('');

      const startsWithCapital = (str) => {
        if (!str || str.trim().length === 0) return false;
        const firstChar = str.trim().charAt(0);
        return firstChar === firstChar.toUpperCase() && firstChar !== firstChar.toLowerCase();
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setWarningMsg('');

        const isNameCapitalized = startsWithCapital(fullName);
        const isAddressCapitalized = startsWithCapital(address);

        if (!isNameCapitalized || !isAddressCapitalized) {
          let error = "Capitalization warning: ";
          if (!isNameCapitalized && !isAddressCapitalized) {
            error += "The first letter of both Full Name and Pickup Address must be capitalized (e.g. Lim Zhi Ying and Ehsan Ria).";
          } else if (!isNameCapitalized) {
            error += "The first letter of Full Name must be capitalized (e.g. Lim Zhi Ying).";
          } else {
            error += "The first letter of Pickup Address must be capitalized (e.g. Ehsan Ria).";
          }
          setWarningMsg(error);
          return;
        }

        setLoading(true);

        const payload = JSON.stringify({
          action: "submitAddress",
          email: autoEmail,
          fullName: fullName.trim(),
          address: address.trim()
        });

        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: payload
          });
          
          setLoading(false);
          setSubmitted(true);
        } catch (err) {
          console.error(err);
          alert("Submission failed. Please check network connection.");
          setLoading(false);
        }
      };

      return (
        <div class="space-y-5">
          <div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">Submit Pickup Address</h2>
            <p class="text-xs text-slate-500">Submitting with an existing Full Name will overwrite your previous entry.</p>
          </div>

          {warningMsg && (
            <div class="bg-red-50 border border-red-200 p-4 rounded-xl text-red-700 text-xs font-medium space-y-1">
              <p class="uppercase text-[10px] tracking-wider font-bold text-red-800">⚠️ Action Required</p>
              <p>{warningMsg}</p>
            </div>
          )}

          {submitted ? (
            <div class="bg-blue-50 border border-[#002ce2] p-5 rounded-xl space-y-2">
              <h3 class="text-sm font-bold text-[#002ce2]">✓ Address Submitted / Overwritten</h3>
              <p class="text-xs text-slate-700">Your row matching "<strong>{fullName}</strong>" in Google Sheets has been updated.</p>
              <button onClick={() => setSubmitted(false)} class="text-xs text-[#002ce2] font-semibold underline mt-2 block">
                Edit address or submit another
              </button>
            </div>
          ) : (
            <form class="space-y-4" onSubmit={handleSubmit}>
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Full Name</label>
                <input 
                  required 
                  value={fullName} 
                  onChange={(e) => setFullName(e.target.value)} 
                  type="text" 
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs text-slate-900 focus:border-[#002ce2] focus:bg-white outline-none transition" 
                  placeholder="Lim Zhi Ying" 
                />
                <span class="text-[10px] text-slate-400 mt-0.5 block">Example: Lim Zhi Ying</span>
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Pickup Address</label>
                <textarea 
                  required 
                  value={address} 
                  onChange={(e) => setAddress(e.target.value)} 
                  class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs text-slate-900 focus:border-[#002ce2] focus:bg-white outline-none h-24 transition" 
                  placeholder="Ehsan Ria"
                ></textarea>
                <span class="text-[10px] text-slate-400 mt-0.5 block">Example: Ehsan Ria</span>
              </div>

              <button 
                disabled={loading} 
                type="submit" 
                class="w-full bg-[#002ce2] hover:bg-[#0040e4] text-white font-bold py-2.5 rounded-lg transition duration-150 text-xs tracking-wide disabled:opacity-50 shadow-sm"
              >
                {loading ? "Saving to Spreadsheet..." : "Submit Address"}
              </button>
            </form>
          )}
        </div>
      );
    };

    // --- 2. Live Agenda Component ---
    const AgendaView = () => {
      const [agendaItems, setAgendaItems] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`${APPS_SCRIPT_URL}?action=getAgenda`)
          .then((res) => res.json())
          .then((data) => {
            if (Array.isArray(data) && data.length > 0) {
              setAgendaItems(data);
            }
            setLoading(false);
          })
          .catch((err) => {
            console.error("Failed to fetch agenda:", err);
            setLoading(false);
          });
      }, []);

      return (
        <div class="space-y-4">
          <div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">Trip Agenda</h2>
            <p class="text-xs text-slate-500">Live schedule from master spreadsheet</p>
          </div>

          {loading ? (
            <div class="p-6 text-center text-xs text-slate-400">Loading agenda...</div>
          ) : agendaItems.length > 0 ? (
            <div class="space-y-3">
              {agendaItems.map((item, index) => {
                const isDay2 = item.day && item.day.toString().toLowerCase().includes('2');
                return (
                  <div 
                    key={index} 
                    class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm"
                  >
                    <div class="flex justify-between items-center mb-1">
                      <span class={`inline-block text-[11px] font-bold px-2.5 py-0.5 rounded ${
                        isDay2 
                          ? 'bg-[#f7f301] text-slate-900 border border-slate-900' 
                          : 'bg-[#002ce2] text-white'
                      }`}>
                        {item.day || 'Day 1'} {item.time ? `• ${formatTimeDisplay(item.time)}` : ''}
                      </span>
                      <span class="text-[10px] font-semibold text-slate-400 uppercase">{item.status || 'Confirmed'}</span>
                    </div>
                    {item.activity && <h3 class="text-sm font-bold text-slate-900 mt-1">{item.activity}</h3>}
                    {item.details && <p class="text-xs text-slate-600 mt-0.5">{item.details}</p>}
                  </div>
                );
              })}
            </div>
          ) : (
            <div class="p-4 text-center text-xs text-slate-400">No agenda items found.</div>
          )}
        </div>
      );
    };

    // --- 3. Transportation Component (#002ce2, #0040e4, #f7f301, #ffffff Integration) ---
    const TransportView = ({ isAdmin }) => {
      const [participants, setParticipants] = useState([]);
      const [addressMap, setAddressMap] = useState({});
      const [cars, setCars] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [draggedName, setDraggedName] = useState(null);
      const [customStopInputs, setCustomStopInputs] = useState({});

      const loadData = () => {
        setLoading(true);
        fetch(`${APPS_SCRIPT_URL}?action=getTransportData`)
          .then((res) => res.json())
          .then((data) => {
            setParticipants(data.participants || []);
            setAddressMap(data.addressMap || {});
            
            const cleanedCars = (data.cars || []).map((c) => ({
              ...c,
              departureTime: formatTimeDisplay(c.departureTime)
            }));
            setCars(cleanedCars);
            setLoading(false);
          })
          .catch((err) => {
            console.error(err);
            setLoading(false);
          });
      };

      useEffect(() => {
        loadData();
      }, []);

      const toggleDriver = (personName) => {
        const isCurrentlyDriver = cars.some((c) => c.driver === personName);

        if (isCurrentlyDriver) {
          const updatedCars = cars.filter((c) => c.driver !== personName);
          setCars(updatedCars);
        } else {
          const newCarId = `Car 0${cars.length + 1}`;
          const newCar = {
            carId: newCarId,
            driver: personName,
            departureTime: '01:30 PM',
            pickupRoute: 'Homestay',
            passengers: [],
            status: 'Confirmed'
          };
          const updatedCars = cars.map((c) => ({
            ...c,
            passengers: (c.passengers || []).filter((p) => p !== personName)
          }));
          setCars([...updatedCars, newCar]);
        }
      };

      const driverNames = cars.map((c) => c.driver);
      const assignedPassengerNames = cars.flatMap((c) => c.passengers || []);
      const unassignedPassengers = participants.filter(
        (p) => !driverNames.includes(p) && !assignedPassengerNames.includes(p)
      );

      const assignToCar = (passengerName, carIndex) => {
        const updatedCars = cars.map((car, idx) => {
          const cleaned = (car.passengers || []).filter((p) => p !== passengerName);
          if (idx === carIndex) {
            return { ...car, passengers: [...cleaned, passengerName] };
          }
          return { ...car, passengers: cleaned };
        });
        setCars(updatedCars);
      };

      const unassignPassenger = (passengerName) => {
        const updatedCars = cars.map((car) => ({
          ...car,
          passengers: (car.passengers || []).filter((p) => p !== passengerName)
        }));
        setCars(updatedCars);
      };

      const parseRouteStops = (routeStr) => {
        if (!routeStr) return [];
        return routeStr.split(' ➔ ').map((s) => s.trim()).filter(Boolean);
      };

      const updateRouteFromStops = (carIdx, stopsArray) => {
        const newRouteStr = stopsArray.join(' ➔ ');
        setCars(cars.map((c, idx) => idx === carIdx ? { ...c, pickupRoute: newRouteStr } : c));
      };

      const appendStopToCar = (carIdx, stopName) => {
        if (!stopName) return;
        const currentStops = parseRouteStops(cars[carIdx].pickupRoute);
        const homestayIdx = currentStops.indexOf('Homestay');
        
        if (homestayIdx !== -1) {
          currentStops.splice(homestayIdx, 0, stopName);
        } else {
          currentStops.push(stopName);
          currentStops.push('Homestay');
        }
        updateRouteFromStops(carIdx, currentStops);
      };

      const removeStopFromCar = (carIdx, stopIdx) => {
        const currentStops = parseRouteStops(cars[carIdx].pickupRoute);
        currentStops.splice(stopIdx, 1);
        updateRouteFromStops(carIdx, currentStops);
      };

      const moveStopInCar = (carIdx, stopIdx, direction) => {
        const currentStops = parseRouteStops(cars[carIdx].pickupRoute);
        const targetIdx = stopIdx + direction;
        if (targetIdx < 0 || targetIdx >= currentStops.length) return;
        
        const temp = currentStops[stopIdx];
        currentStops[stopIdx] = currentStops[targetIdx];
        currentStops[targetIdx] = temp;
        updateRouteFromStops(carIdx, currentStops);
      };

      const saveToSheet = async () => {
        setSaving(true);
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateTransport",
              cars: cars
            })
          });
          alert("Transportation details synced to Google Sheets!");
          setSaving(false);
        } catch (err) {
          console.error(err);
          alert("Failed to save to spreadsheet.");
          setSaving(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="text-xl font-bold text-slate-900 mb-1">Car & Transport Arrangements</h2>
              <p class="text-xs text-slate-500">
                {isAdmin ? "Admin Controls: Select drivers, assign passengers, and edit pickup routes." : "Departure times, driver info, and passenger routes."}
              </p>
            </div>
            {isAdmin && (
              <button 
                onClick={saveToSheet} 
                disabled={saving || loading}
                class="bg-[#002ce2] hover:bg-[#0040e4] text-white font-bold px-3.5 py-2 rounded-lg text-xs transition shadow-sm disabled:opacity-50"
              >
                {saving ? "Syncing..." : "Save & Sync to Sheet"}
              </button>
            )}
          </div>

          {loading ? (
            <div class="p-6 text-center text-xs text-slate-400">Loading transport data...</div>
          ) : !isAdmin ? (
            /* --- GUEST READ-ONLY VIEW --- */
            <div class="space-y-4">
              {cars.length === 0 ? (
                <div class="p-4 text-center text-xs text-slate-400">No cars arranged yet.</div>
              ) : (
                cars.map((car, idx) => {
                  const routeStops = parseRouteStops(car.pickupRoute);
                  return (
                    <div key={idx} class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
                      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                        <div>
                          <span class="text-[10px] font-black text-[#002ce2] uppercase tracking-wider">{car.carId}</span>
                          <h3 class="text-sm font-bold text-slate-900">Driver: {car.driver}</h3>
                        </div>
                        <span class="bg-[#002ce2] text-white text-xs font-bold px-2.5 py-1 rounded">
                          🕒 Departs: {car.departureTime || '01:30 PM'}
                        </span>
                      </div>

                      <div class="space-y-1">
                        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">📍 Pickup Route Sequence:</span>
                        <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-800 font-medium">
                          {routeStops.length > 0 ? (
                            routeStops.map((stop, sIdx) => (
                              <React.Fragment key={sIdx}>
                                <span class="bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-md text-xs font-bold text-slate-900">
                                  {stop}
                                </span>
                                {sIdx < routeStops.length - 1 && <span class="text-[#002ce2] font-black">➔</span>}
                              </React.Fragment>
                            ))
                          ) : (
                            <span class="text-slate-400 italic">Direct to Homestay</span>
                          )}
                        </div>
                      </div>

                      <div class="space-y-1 pt-1">
                        <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">👥 Passengers ({car.passengers ? car.passengers.length : 0}):</span>
                        <div class="flex flex-wrap gap-1.5">
                          {car.passengers && car.passengers.length > 0 ? (
                            car.passengers.map((p, pIdx) => (
                              <span key={pIdx} class="bg-[#f7f301] text-slate-900 text-xs font-bold px-2.5 py-1 rounded-md border border-slate-900">
                                {p}
                              </span>
                            ))
                          ) : (
                            <span class="text-xs text-slate-400 italic">No passengers assigned</span>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          ) : (
            /* --- ADMIN VIEW --- */
            <div class="space-y-6">
              {/* Driver Selection */}
              <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-700 block">
                  🚗 Choose Drivers (Tick / Untick):
                </span>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {participants.map((person, idx) => {
                    const isDriver = driverNames.includes(person);
                    return (
                      <label key={idx} class={`flex items-center gap-2 p-2 rounded-lg border text-xs font-bold cursor-pointer transition ${isDriver ? 'bg-[#002ce2] text-white border-[#002ce2]' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-100'}`}>
                        <input type="checkbox" checked={isDriver} onChange={() => toggleDriver(person)} class="w-3.5 h-3.5 accent-[#f7f301] cursor-pointer" />
                        <span class="truncate">{person} {isDriver ? '(Driver)' : ''}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {/* Unassigned Passenger Scratch Blocks */}
              <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 block mb-2">
                  🧩 Unassigned Passenger Blocks ({unassignedPassengers.length})
                </span>
                <div class="flex flex-wrap gap-2">
                  {unassignedPassengers.map((name, i) => (
                    <div key={i} draggable onDragStart={() => setDraggedName(name)} class="scratch-block px-3 py-1.5 flex items-center gap-2">
                      <span>⋮⋮ {name}</span>
                      <select onChange={(e) => e.target.value !== "" && assignToCar(name, parseInt(e.target.value))} class="bg-slate-900 text-white text-[10px] rounded px-1.5 py-0.5 outline-none font-bold cursor-pointer" defaultValue="">
                        <option value="" disabled>+ Car</option>
                        {cars.map((c, cIdx) => <option key={cIdx} value={cIdx}>{c.driver}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              </div>

              {/* Driver Car Cards */}
              <div class="space-y-4">
                {cars.map((car, carIdx) => {
                  const carPeople = [car.driver, ...(car.passengers || [])].filter(Boolean);
                  const routeStops = parseRouteStops(car.pickupRoute);
                  return (
                    <div key={carIdx} onDragOver={(e) => e.preventDefault()} onDrop={() => draggedName && assignToCar(draggedName, carIdx)} class="bg-white border-2 border-[#002ce2] rounded-xl p-4 space-y-4 shadow-sm">
                      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
                        <div>
                          <span class="text-xs font-black text-[#002ce2] uppercase tracking-wider">{car.carId}</span>
                          <h3 class="text-sm font-bold text-slate-900">Driver: {car.driver}</h3>
                        </div>
                        <button onClick={() => toggleDriver(car.driver)} class="bg-red-50 text-red-600 text-[11px] font-bold px-2.5 py-1 rounded-md border border-red-200">Untick Driver</button>
                      </div>

                      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                        <div>
                          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Departure Time</label>
                          <input type="text" value={car.departureTime} onChange={(e) => setCars(cars.map((c, idx) => idx === carIdx ? { ...c, departureTime: e.target.value } : c))} class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none focus:border-[#002ce2]" />
                        </div>
                        <div>
                          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Route Text String</label>
                          <input type="text" value={car.pickupRoute} onChange={(e) => setCars(cars.map((c, idx) => idx === carIdx ? { ...c, pickupRoute: e.target.value } : c))} class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none focus:border-[#002ce2]" />
                        </div>
                      </div>

                      {/* Route Rearranger */}
                      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-3">
                        <div class="flex justify-between items-center">
                          <span class="text-[11px] font-bold text-slate-700 uppercase">📍 Rearrange Route:</span>
                          <button type="button" onClick={() => updateRouteFromStops(carIdx, ['Homestay'])} class="text-[11px] text-red-600 font-bold underline">Reset Route</button>
                        </div>
                        <div class="flex flex-wrap gap-2 items-center">
                          {routeStops.map((stop, sIdx) => (
                            <React.Fragment key={sIdx}>
                              <div class="bg-white border border-slate-900 rounded-lg px-2 py-1 text-xs font-bold flex items-center gap-1 shadow-sm">
                                <span>{stop}</span>
                                {sIdx > 0 && <button type="button" onClick={() => moveStopInCar(carIdx, sIdx, -1)} class="text-[#002ce2] font-black px-0.5">←</button>}
                                {sIdx < routeStops.length - 1 && <button type="button" onClick={() => moveStopInCar(carIdx, sIdx, 1)} class="text-[#002ce2] font-black px-0.5">→</button>}
                                <button type="button" onClick={() => removeStopFromCar(carIdx, sIdx)} class="text-red-600 font-black px-0.5">✕</button>
                              </div>
                              {sIdx < routeStops.length - 1 && <span class="text-xs text-[#002ce2] font-black">➔</span>}
                            </React.Fragment>
                          ))}
                        </div>

                        <div class="border-t border-slate-200 pt-2 space-y-1.5">
                          <span class="text-[10px] font-bold text-slate-500 uppercase block">Add Stops for {car.driver}'s Car:</span>
                          <div class="flex flex-wrap gap-1 items-center">
                            {carPeople.map((personName, pIdx) => addressMap[personName] ? (
                              <button key={pIdx} type="button" onClick={() => appendStopToCar(carIdx, `${personName} (${addressMap[personName]})`)} class="bg-white border border-slate-300 rounded px-2 py-0.5 text-[10px] font-bold text-slate-800 hover:bg-slate-100">+ {personName}</button>
                            ) : null)}

                            {['UM', 'KL Sentral', 'LRT Station'].map((point, ptIdx) => (
                              <button key={ptIdx} type="button" onClick={() => appendStopToCar(carIdx, point)} class="bg-[#f7f301] border border-slate-900 rounded px-2 py-0.5 text-[10px] font-black text-slate-900 hover:bg-yellow-300">+ {point}</button>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Passenger Drop Area */}
                      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 min-h-[50px] space-y-2">
                        <span class="text-[11px] font-bold text-slate-500 uppercase block">Passengers ({car.passengers ? car.passengers.length : 0}):</span>
                        <div class="flex flex-wrap gap-2">
                          {car.passengers && car.passengers.map((pName, pIdx) => (
                            <div key={pIdx} class="scratch-block px-3 py-1 flex items-center gap-2">
                              <span>{pName}</span>
                              <button onClick={() => unassignPassenger(pName)} class="bg-red-600 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center font-black">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- 4. Receipts and Bills Component (weighted per-person split) ---
    // Each bill stores a "share weight" per participant:
    //   1 = full share, 0.5 = half share, 0.25 = quarter share, 0 = not included.
    // A person's cost for a bill = bill total × (their weight ÷ sum of all weights).
    const SHARE_CYCLE = [1, 0.5, 0.25, 0];
    const shareLabel = (w) => {
      if (w >= 1) return 'Full';
      if (w === 0.75) return '¾';
      if (w === 0.5) return '½';
      if (w === 0.25) return '¼';
      if (w <= 0) return 'Out';
      return `×${w}`;
    };
    const BILL_COLORS = ['#002ce2', '#f7f301', '#0f172a', '#60a5fa', '#f59e0b', '#10b981', '#a855f7', '#ef4444', '#94a3b8', '#0ea5e9'];

    // Reads the split saved in the sheet. Accepts "Name:1, Name:0.5", JSON, or a plain name list.
    // If nothing is saved for a bill, everyone gets a full share (the old behaviour).
    const parseShares = (raw, participants) => {
      let obj = null;
      if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
        obj = raw;
      } else if (Array.isArray(raw)) {
        obj = {};
        raw.forEach((n) => { obj[n] = 1; });
      } else if (typeof raw === 'string' && raw.trim()) {
        const s = raw.trim();
        if (s.startsWith('{')) {
          try { obj = JSON.parse(s); } catch (e) { obj = null; }
        }
        if (!obj) {
          obj = {};
          s.split(',').forEach((part) => {
            const piece = part.trim();
            if (!piece) return;
            const colon = piece.lastIndexOf(':');
            if (colon === -1) {
              obj[piece] = 1;
            } else {
              const name = piece.slice(0, colon).trim();
              const w = parseFloat(piece.slice(colon + 1));
              if (name) obj[name] = isNaN(w) ? 1 : w;
            }
          });
        }
      }
      const result = {};
      participants.forEach((p) => {
        if (!obj) result[p] = 1;
        else result[p] = obj[p] !== undefined ? (Number(obj[p]) || 0) : 0;
      });
      return result;
    };

    // Turns the split into readable text for the sheet, e.g. "Lim Zhi Ying:1, Yiyin:0.5"
    const serializeShares = (shares) =>
      Object.entries(shares || {}).map(([name, w]) => `${name}:${w}`).join(', ');

    const BillsView = ({ isAdmin }) => {
      const [participants, setParticipants] = useState([]);
      const [bills, setBills] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      const everyoneFull = (list) => {
        const s = {};
        list.forEach((p) => { s[p] = 1; });
        return s;
      };

      useEffect(() => {
        fetch(`${APPS_SCRIPT_URL}?action=getBillsData`)
          .then((res) => res.json())
          .then((data) => {
            const people = data.participants || [];
            setParticipants(people);
            setBills((data.bills || []).map((b) => ({
              ...b,
              shares: parseShares(b.splitShares !== undefined ? b.splitShares : b.shares, people)
            })));
            setLoading(false);
          })
          .catch((err) => {
            console.error("Failed to load bills:", err);
            setLoading(false);
          });
      }, []);

      const handleBillChange = (index, field, value) => {
        const updated = bills.map((b, idx) => {
          if (idx === index) {
            return { ...b, [field]: value };
          }
          return b;
        });
        setBills(updated);
      };

      const setShare = (billIdx, person, weight) => {
        setBills(bills.map((b, idx) =>
          idx === billIdx ? { ...b, shares: { ...(b.shares || {}), [person]: weight } } : b
        ));
      };

      const cycleShare = (billIdx, person) => {
        const current = (bills[billIdx].shares || {})[person];
        const curr = current === undefined ? 1 : current;
        const pos = SHARE_CYCLE.indexOf(curr);
        const next = SHARE_CYCLE[(pos + 1) % SHARE_CYCLE.length];
        setShare(billIdx, person, next);
      };

      const setAllShares = (billIdx, weight) => {
        const s = {};
        participants.forEach((p) => { s[p] = weight; });
        setBills(bills.map((b, idx) => idx === billIdx ? { ...b, shares: s } : b));
      };

      const addBillRow = () => {
        const defaultPayer = participants.length > 0 ? participants[0] : 'Lim Zhi Ying';
        setBills([...bills, { item: 'New Expense Item', paidBy: defaultPayer, totalAmount: 0, shares: everyoneFull(participants) }]);
      };

      const deleteBillRow = (index) => {
        setBills(bills.filter((_, idx) => idx !== index));
      };

      const saveBillsToSheet = async () => {
        setSaving(true);
        try {
          const payloadBills = bills.map(({ shares, ...rest }) => ({
            ...rest,
            splitShares: serializeShares(shares)
          }));
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateBills",
              bills: payloadBills
            })
          });
          alert("Bills updated and synced to Google Sheets!");
          setSaving(false);
        } catch (err) {
          console.error(err);
          alert("Failed to save bills.");
          setSaving(false);
        }
      };

      // --- Per-bill calculations ---
      const billCalcs = bills.map((b) => {
        const total = parseFloat(b.totalAmount) || 0;
        const shares = b.shares || everyoneFull(participants);
        const totalWeight = participants.reduce((acc, p) => acc + (shares[p] || 0), 0);
        const perPerson = {};
        participants.forEach((p) => {
          perPerson[p] = totalWeight > 0 ? (total * (shares[p] || 0)) / totalWeight : 0;
        });
        const sharers = participants.filter((p) => (shares[p] || 0) > 0);
        const allEqual = sharers.every((p) => shares[p] === shares[sharers[0]]);
        return { total, shares, totalWeight, perPerson, sharers, allEqual };
      });

      const totalCost = billCalcs.reduce((acc, c) => acc + c.total, 0);
      const unsplitTotal = billCalcs.reduce((acc, c) => acc + (c.totalWeight > 0 ? 0 : c.total), 0);

      // --- Per-person totals ---
      const paidMap = {};
      const owedMap = {};
      participants.forEach((p) => { paidMap[p] = 0; owedMap[p] = 0; });
      bills.forEach((b, idx) => {
        const payer = b.paidBy || (participants[0] || 'Lim Zhi Ying');
        paidMap[payer] = (paidMap[payer] || 0) + billCalcs[idx].total;
      });
      billCalcs.forEach((c) => {
        participants.forEach((p) => { owedMap[p] += c.perPerson[p]; });
      });

      const balances = participants.map((p) => {
        const paid = paidMap[p] || 0;
        const owed = owedMap[p] || 0;
        return { name: p, paid, owed, net: paid - owed };
      });

      const maxOwed = Math.max(0.01, ...balances.map((b) => b.owed));

      // --- Settlement: largest debts matched to largest credits first ---
      const settlements = [];
      const debtors = balances.filter((b) => b.net < -0.01).map((b) => ({ ...b, owes: Math.abs(b.net) })).sort((a, b) => b.owes - a.owes);
      const creditors = balances.filter((b) => b.net > 0.01).map((b) => ({ ...b, gets: b.net })).sort((a, b) => b.gets - a.gets);

      debtors.forEach((d) => {
        creditors.forEach((c) => {
          if (d.owes > 0.01 && c.gets > 0.01) {
            const transfer = Math.min(d.owes, c.gets);
            settlements.push({ from: d.name, to: c.name, amount: transfer });
            d.owes -= transfer;
            c.gets -= transfer;
          }
        });
      });

      const colCount = isAdmin ? 5 : 4;

      return (
        <div class="space-y-6">
          <div class="flex justify-between items-start">
            <div>
              <h2 class="text-xl font-bold text-slate-900 mb-1">Receipts and Bills</h2>
              <p class="text-xs text-slate-500">
                {isAdmin ? "Admin Controls: Add expenses, edit amounts, update who paid, and choose who shares each bill." : "Itemized expenses, who shares each one, and settlement summary."}
              </p>
            </div>
            {isAdmin && (
              <button 
                onClick={saveBillsToSheet} 
                disabled={saving || loading}
                class="bg-[#002ce2] hover:bg-[#0040e4] text-white font-bold px-3.5 py-2 rounded-lg text-xs transition shadow-sm disabled:opacity-50"
              >
                {saving ? "Syncing..." : "Save & Sync Bills"}
              </button>
            )}
          </div>

          {loading ? (
            <div class="p-6 text-center text-xs text-slate-400">Loading bills...</div>
          ) : (
            <div class="space-y-6">
              
              {/* Itemized Expenses Table */}
              <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm space-y-2">
                <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                  <h3 class="text-xs font-bold uppercase text-slate-700 tracking-wider">1. Itemized Expenses</h3>
                  {isAdmin && (
                    <button onClick={addBillRow} class="bg-[#f7f301] hover:bg-yellow-300 text-slate-900 border border-slate-900 font-extrabold px-3 py-1 rounded text-xs transition shadow-sm">
                      + Add Expense Item
                    </button>
                  )}
                </div>

                {isAdmin && (
                  <div class="mx-3 bg-blue-50 border border-blue-200 rounded-lg p-2.5 text-[11px] text-slate-700 leading-relaxed">
                    <strong class="text-[#002ce2]">How splitting works:</strong> tap a name under an expense to change their share:
                    <strong> Full → ½ → ¼ → Out</strong>. A ½ share pays half of what a Full share pays.
                    Example: RM 300 split by 5 Full + 1 half = 5.5 shares → Full pays RM 54.55, half pays RM 27.27.
                  </div>
                )}

                <div class="overflow-x-auto p-2">
                  <table class="w-full text-left text-xs text-slate-800">
                    <thead class="bg-[#002ce2] text-white uppercase text-[10px] font-bold tracking-wider">
                      <tr>
                        <th class="p-2.5">Expense Item</th>
                        <th class="p-2.5">Paid Upfront By</th>
                        <th class="p-2.5 text-right">Total (MYR)</th>
                        <th class="p-2.5 text-right">Split</th>
                        {isAdmin && <th class="p-2.5 text-center">Action</th>}
                      </tr>
                    </thead>
                    <tbody>
                      {bills.length > 0 ? (
                        bills.map((b, idx) => {
                          const calc = billCalcs[idx];
                          return (
                            <React.Fragment key={idx}>
                              <tr class="align-top">
                                <td class="p-2.5 pb-1.5 font-bold text-slate-900">
                                  <span class="flex items-center gap-1.5">
                                    <span class="inline-block w-2.5 h-2.5 rounded-sm border border-slate-900/20 shrink-0" style={{ backgroundColor: BILL_COLORS[idx % BILL_COLORS.length] }}></span>
                                    {isAdmin ? (
                                      <input type="text" value={b.item} onChange={(e) => handleBillChange(idx, 'item', e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded p-1.5 font-bold text-xs outline-none focus:border-[#002ce2]" />
                                    ) : b.item}
                                  </span>
                                </td>

                                <td class="p-2.5 pb-1.5 font-bold text-[#002ce2]">
                                  {isAdmin ? (
                                    <select value={b.paidBy || (participants[0] || '')} onChange={(e) => handleBillChange(idx, 'paidBy', e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded p-1.5 font-bold text-xs outline-none text-[#002ce2] cursor-pointer">
                                      {participants.map((person, pIdx) => <option key={pIdx} value={person}>{person}</option>)}
                                    </select>
                                  ) : b.paidBy}
                                </td>

                                <td class="p-2.5 pb-1.5 text-right font-black text-slate-900">
                                  {isAdmin ? (
                                    <div class="flex items-center justify-end gap-1">
                                      <span class="font-bold text-slate-400">RM</span>
                                      <input type="number" step="0.01" value={b.totalAmount} onChange={(e) => handleBillChange(idx, 'totalAmount', e.target.value)} class="w-24 bg-slate-50 border border-slate-200 rounded p-1.5 font-black text-right text-xs outline-none focus:border-[#002ce2]" />
                                    </div>
                                  ) : `RM ${calc.total.toFixed(2)}`}
                                </td>

                                <td class="p-2.5 pb-1.5 text-right font-bold text-slate-600 whitespace-nowrap">
                                  {calc.totalWeight === 0 ? (
                                    <span class="text-red-600">Nobody selected</span>
                                  ) : calc.allEqual ? (
                                    <React.Fragment>
                                      {calc.sharers.length} pax
                                      <span class="block text-[10px] text-slate-400">RM {(calc.total / calc.sharers.length).toFixed(2)} each</span>
                                    </React.Fragment>
                                  ) : (
                                    <React.Fragment>
                                      {calc.sharers.length} pax
                                      <span class="block text-[10px] text-[#002ce2]">custom split</span>
                                    </React.Fragment>
                                  )}
                                </td>

                                {isAdmin && (
                                  <td class="p-2.5 pb-1.5 text-center">
                                    <button onClick={() => deleteBillRow(idx)} class="text-red-600 font-bold p-1">✕</button>
                                  </td>
                                )}
                              </tr>

                              {/* Who shares this bill */}
                              <tr class="border-b border-slate-100">
                                <td colSpan={colCount} class="px-2.5 pb-3 pt-0">
                                  <div class="flex flex-wrap items-center gap-1.5">
                                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mr-0.5">Split:</span>
                                    {participants.map((p, pIdx) => {
                                      const w = calc.shares[p] || 0;
                                      const out = w <= 0;
                                      const chipClass = out
                                        ? 'bg-slate-50 text-slate-400 border-slate-200 border-dashed'
                                        : w >= 1
                                          ? 'bg-[#002ce2] text-white border-[#002ce2]'
                                          : 'bg-[#f7f301] text-slate-900 border-slate-900';
                                      const content = (
                                        <React.Fragment>
                                          {p}
                                          <span class="font-semibold opacity-80"> · {shareLabel(w)}{!out ? ` · RM ${calc.perPerson[p].toFixed(2)}` : ''}</span>
                                        </React.Fragment>
                                      );
                                      return isAdmin ? (
                                        <button key={pIdx} type="button" onClick={() => cycleShare(idx, p)} title="Tap to change: Full → ½ → ¼ → Out" class={`text-[10px] font-bold px-2 py-0.5 rounded-md border transition hover:brightness-95 ${chipClass}`}>
                                          {content}
                                        </button>
                                      ) : (
                                        <span key={pIdx} class={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${chipClass}`}>
                                          {content}
                                        </span>
                                      );
                                    })}
                                    {isAdmin && (
                                      <React.Fragment>
                                        <button type="button" onClick={() => setAllShares(idx, 1)} class="text-[10px] font-bold underline text-[#002ce2] ml-1">All</button>
                                        <button type="button" onClick={() => setAllShares(idx, 0)} class="text-[10px] font-bold underline text-red-600">None</button>
                                      </React.Fragment>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            </React.Fragment>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan={colCount} class="p-4 text-center text-slate-400 italic">No bills recorded.</td>
                        </tr>
                      )}
                    </tbody>
                    <tfoot class="bg-[#f7f301] font-black text-slate-900 border-t border-slate-900">
                      <tr>
                        <td class="p-3 uppercase text-xs" colSpan="2">TOTAL EXPENSES</td>
                        <td class="p-3 text-right">RM {totalCost.toFixed(2)}</td>
                        <td class="p-3 text-right text-[10px] font-bold">{participants.length} people</td>
                        {isAdmin && <td></td>}
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              {unsplitTotal > 0.01 && (
                <div class="bg-red-50 border border-red-200 p-3 rounded-xl text-red-700 text-xs font-semibold">
                  ⚠️ RM {unsplitTotal.toFixed(2)} of expenses has nobody selected to split it, so it isn't charged to anyone yet.
                </div>
              )}

              {/* Visual: who pays for what */}
              <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3 shadow-sm">
                <div>
                  <h3 class="text-xs font-bold uppercase text-slate-600 tracking-wider">2. Who Pays for What</h3>
                  <p class="text-[10px] text-slate-500 mt-0.5">Each bar is that person's share of the trip, coloured by expense. Hover a segment to see the amount.</p>
                </div>

                <div class="flex flex-wrap gap-x-3 gap-y-1">
                  {bills.map((b, i) => billCalcs[i].total > 0 ? (
                    <span key={i} class="flex items-center gap-1 text-[10px] font-semibold text-slate-600">
                      <span class="inline-block w-2.5 h-2.5 rounded-sm border border-slate-900/20" style={{ backgroundColor: BILL_COLORS[i % BILL_COLORS.length] }}></span>
                      {b.item || `Item ${i + 1}`}
                    </span>
                  ) : null)}
                </div>

                <div class="space-y-2.5">
                  {balances.map((b, idx) => (
                    <div key={idx} class="space-y-1">
                      <div class="flex justify-between text-[11px] font-bold gap-2">
                        <span class="text-slate-900 truncate">{b.name}</span>
                        <span class="text-slate-700 shrink-0">RM {b.owed.toFixed(2)}</span>
                      </div>
                      <div class="w-full h-3.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full flex" style={{ width: `${(b.owed / maxOwed) * 100}%` }}>
                          {billCalcs.map((c, i) => {
                            const part = c.perPerson[b.name];
                            if (!part || part <= 0 || b.owed <= 0) return null;
                            return (
                              <div
                                key={i}
                                title={`${bills[i].item}: RM ${part.toFixed(2)}`}
                                class="h-full"
                                style={{ width: `${(part / b.owed) * 100}%`, backgroundColor: BILL_COLORS[i % BILL_COLORS.length] }}
                              ></div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Settlement Summary */}
              <div class="bg-blue-50/50 border-2 border-[#002ce2] rounded-xl p-4 space-y-3">
                <span class="inline-block bg-[#002ce2] text-white text-[10px] font-bold px-2.5 py-1 rounded uppercase tracking-wider">
                  💸 Settlement Summary (Who Pays Who)
                </span>
                
                {settlements.length > 0 ? (
                  <div class="space-y-2 pt-1">
                    {settlements.map((s, idx) => (
                      <div key={idx} class="bg-white border border-slate-200 p-3 rounded-lg flex items-center justify-between text-xs font-bold shadow-sm">
                        <div class="flex items-center gap-2">
                          <span class="bg-red-50 text-red-700 px-2 py-0.5 rounded border border-red-200 text-[10px]">{s.from}</span>
                          <span class="text-[#002ce2] font-black">➔</span>
                          <span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200 text-[10px]">{s.to}</span>
                        </div>
                        <span class="text-xs font-black text-[#002ce2]">Pay RM {s.amount.toFixed(2)}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p class="text-xs text-slate-500 font-semibold italic">Everyone is even or no participants registered yet!</p>
                )}
              </div>

              {/* Individual Balances */}
              <div class="space-y-3">
                <h3 class="text-xs font-bold uppercase text-slate-600 tracking-wider">3. Individual Participant Balances</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {balances.map((b, idx) => {
                    const isOwed = b.net > 0.01;
                    const owes = b.net < -0.01;
                    return (
                      <div key={idx} class="bg-white border border-slate-200 p-3.5 rounded-xl flex justify-between items-center text-xs shadow-sm gap-2">
                        <div>
                          <p class="font-bold text-slate-900">{b.name}</p>
                          <p class="text-[10px] text-slate-500">Paid Upfront: RM {b.paid.toFixed(2)} | Their Share: RM {b.owed.toFixed(2)}</p>
                        </div>
                        <div class="text-right shrink-0">
                          {isOwed && (
                            <span class="bg-emerald-50 text-emerald-800 font-bold text-[11px] px-2.5 py-1 rounded border border-emerald-200 block">
                              Gets Back RM {b.net.toFixed(2)}

    const SLIDE_MS = 3000; // slideshow moves every 3 seconds

    // Image that tries the second Drive link if the first one fails, then shows a fallback
    const DriveImage = ({ id, w, alt, className, eager, fallback }) => {
      const [attempt, setAttempt] = useState(0);
      useEffect(() => { setAttempt(0); }, [id, w]);
      if (attempt >= 2) return fallback || null;
      const src = attempt === 0 ? driveImg(id, w) : driveImgAlt(id, w);
      return (
        <img
          src={src}
          alt={alt || ''}
          className={className}
          loading={eager ? 'eager' : 'lazy'}
          referrerPolicy="no-referrer"
          draggable="false"
          onError={() => setAttempt(attempt + 1)}
        />
      );
    };

    // Loads the list of photos/videos from the Drive folder (through Apps Script)
    const useDriveMedia = () => {
      const [media, setMedia] = useState([]);
      const [status, setStatus] = useState('loading');
      useEffect(() => {
        fetch(`${APPS_SCRIPT_URL}?action=getMedia`)
          .then((res) => res.json())
          .then((data) => {
            const list = Array.isArray(data) ? data : ((data && data.media) || []);
            setMedia(list);
            setStatus(list.length > 0 ? 'ready' : 'empty');
          })
          .catch((err) => {
            console.error('Failed to load Drive media:', err);
            setStatus('error');
          });
      }, []);
      return { media, status };
    };

    // Fades + slides content in when it scrolls into view
    const Reveal = ({ children, delay, className }) => {
      const ref = React.useRef(null);
      const [shown, setShown] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (!('IntersectionObserver' in window)) { setShown(true); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) { setShown(true); io.disconnect(); }
          });
        }, { threshold: 0.12 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return (
        <div ref={ref} className={`reveal ${shown ? 'reveal-in' : ''} ${className || ''}`} style={{ transitionDelay: `${delay || 0}ms` }}>
          {children}
        </div>
      );
    };

    const pad2 = (n) => (n < 10 ? `0${n}` : `${n}`);

    // --- Section 1: full-screen photo slideshow ---
    const HeroSlideshow = ({ photos, status }) => {
      const [idx, setIdx] = useState(0);
      const touchX = React.useRef(null);
      const n = photos.length;

      useEffect(() => { if (idx >= n && n > 0) setIdx(0); }, [n]);

      // Auto-advance every 3 s. Restarts the timer whenever the slide changes (also after a manual click).
      useEffect(() => {
        if (n < 2) return;
        const t = setTimeout(() => setIdx((i) => (i + 1) % n), SLIDE_MS);
        return () => clearTimeout(t);
      }, [idx, n]);

      const go = (dir) => { if (n > 0) setIdx((i) => (i + dir + n) % n); };

      // Only the previous, current and next photos are in the page, so 100+ photos stay fast
      const visible = n === 0 ? [] : Array.from(new Set([(idx - 1 + n) % n, idx, (idx + 1) % n]));

      return (
        <section
          className="relative h-[100svh] min-h-[560px] w-full overflow-hidden bg-[#070a17] text-white"
          onTouchStart={(e) => { touchX.current = e.touches[0].clientX; }}
          onTouchEnd={(e) => {
            if (touchX.current === null) return;
            const dx = e.changedTouches[0].clientX - touchX.current;
            if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
            touchX.current = null;
          }}
        >
          {/* Photos */}
          {visible.map((i) => {
            const p = photos[i];
            const active = i === idx;

                <DriveImage id={p.id} w={480} eager className="absolute inset-0 w-full h-full object-cover scale-110 blur-2xl opacity-60" />
                <DriveImage
                  id={p.id}
                  w={1920}
                  eager
                  alt={p.name}
                  className={`absolute inset-0 w-full h-full object-contain ${active ? 'kenburns' : ''}`}
                />
              </div>
            );
          })}

          {/* No photos yet */}
          {n === 0 && (
            <div className="absolute inset-0 hero-empty flex items-center justify-center">
              <div className="text-center px-6 max-w-md">
                <p className="text-[11px] font-bold uppercase tracking-[0.3em] text-white/60 mb-3">
                  {status === 'loading' ? 'Loading photos…' : 'Photo wall'}

                {status !== 'loading' && (
                  <p className="text-sm text-white/80">

                  </p>
                )}
              </div>
            </div>

                <span className="inline-block bg-[#f7f301] text-slate-900 text-[11px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                  4Balance Homestay · 23–24 Oct 2026
                </span>

    // --- Full-screen viewer for photos and videos ---

                    {m.type === 'video' && (
                      <span className="absolute inset-0 flex items-center justify-center">
                        <span className="w-10 h-10 md:w-14 md:h-14 rounded-full bg-[#f7f301] text-slate-900 flex items-center justify-center text-base md:text-xl shadow-lg pl-1">▶</span>
                      </span>
                    )}
                    <span className="absolute inset-0 bg-[#070a17]/0 group-hover:bg-[#070a17]/20 transition"></span>
                  </button>
                ))}
              </div>
            )}

            {/* Page buttons: flip through 6 at a time */}
            {pageCount > 1 && (
              <div className="mt-6 md:mt-8 flex items-center justify-center gap-4">
                <button type="button" onClick={() => goPage(-1)} aria-label="Previous 6" className="w-11 h-11 rounded-full border-2 border-white text-white hover:bg-white hover:text-[#002ce2] transition text-lg">←</button>
                <span className="font-mono text-sm tabular-nums text-white/80 min-w-[5rem] text-center">
                  <span className="text-white font-bold">{safePage + 1}</span> / {pageCount}
                </span>
                <button type="button" onClick={() => goPage(1)} aria-label="Next 6" className="w-11 h-11 rounded-full border-2 border-white text-white hover:bg-white hover:text-[#002ce2] transition text-lg">→</button>
              </div>
            )}
          </div>

          {openIdx !== null && (
            <Lightbox media={media} index={openIdx} onClose={closeBox} onNav={navBox} />
          )}
        </section>
      );
    };

    // --- Section 3: trip recap + shortcuts to the other tabs ---
    const RecapSection = ({ peopleCount, photoCount, videoCount, onNavigate }) => {
      const stats = [
        { value: '1', label: 'Night at the homestay' },
        { value: peopleCount > 0 ? `${peopleCount}` : '—', label: 'People on the trip' },
        { value: `${photoCount}`, label: 'Photos shared' },
        { value: `${videoCount}`, label: 'Videos shared' }
      ];
      const links = [
        { id: 'agenda', label: 'Agenda', desc: 'What we did, hour by hour' },
        { id: 'transport', label: 'Transportation', desc: 'Cars, drivers and pickup routes' },
        { id: 'bills', label: 'Receipts and Bills', desc: 'Who paid, who owes, and how much' },
        { id: 'common', label: 'Common Info', desc: 'Address, Wi-Fi, rules and contacts' }
      ];

      return (
        <section className="bg-[#f7f301] text-slate-900 py-20 md:py-28 px-5 md:px-12">
          <div className="max-w-7xl mx-auto">
            <Reveal>
              <p className="text-[11px] font-bold uppercase tracking-[0.3em] text-[#002ce2] mb-3">02 — The trip</p>
              <h2 className="text-5xl md:text-7xl font-extrabold tracking-tighter leading-[0.9]">Sri Petaling,<br />23–24 October.</h2>
            </Reveal>

            <div className="mt-12 grid grid-cols-2 md:grid-cols-4 border-t-2 border-slate-900">
              {stats.map((s, i) => (
                <Reveal key={i} delay={i * 90} className={`py-6 md:py-8 pr-4 border-b-2 border-slate-900 md:border-b-0 ${i % 2 === 0 ? 'border-r-2 md:border-r-0' : ''} ${i < 3 ? 'md:border-r-2' : ''} ${i % 2 === 1 ? 'pl-4' : ''} ${i > 0 ? 'md:pl-6' : ''}`}>
                  <p className="text-5xl md:text-7xl font-extrabold tracking-tighter tabular-nums">{s.value}</p>
                  <p className="mt-2 text-xs md:text-sm font-semibold text-slate-700">{s.label}</p>
                </Reveal>
              ))}
            </div>

            <div className="mt-14 grid grid-cols-1 md:grid-cols-2 gap-3">
              {links.map((l, i) => (
                <Reveal key={l.id} delay={i * 70}>
                  <button
                    type="button"
                    onClick={() => onNavigate(l.id)}
                    className="group w-full text-left bg-slate-900 text-white rounded-2xl p-6 md:p-7 flex items-center justify-between gap-4 hover:bg-[#002ce2] transition"
                  >
                    <span>
                      <span className="block text-xl md:text-2xl font-extrabold tracking-tight">{l.label}</span>
                      <span className="block mt-1 text-xs md:text-sm text-white/70">{l.desc}</span>
                    </span>
                    <span className="text-2xl transition group-hover:translate-x-1">→</span>
                  </button>
                </Reveal>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // --- Section 4: pickup address form (kept at the bottom now that the trip is over) ---
    const AddressSection = ({ autoEmail }) => (
      <section className="bg-slate-100 text-slate-900 py-20 md:py-28 px-5 md:px-12">
        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
          <Reveal className="lg:col-span-5">
            <p className="text-[11px] font-bold uppercase tracking-[0.3em] text-[#002ce2] mb-3">03 — Pickup</p>
            <h2 className="text-4xl md:text-6xl font-extrabold tracking-tighter leading-[0.9]">Pickup<br />address.</h2>
            <p className="mt-4 text-sm text-slate-600 max-w-sm">
              Drivers use these addresses to plan the pickup routes in the Transportation tab.
            </p>
          </Reveal>
          <Reveal className="lg:col-span-7" delay={120}>
            <div className="bg-white rounded-2xl p-6 md:p-8 shadow-xl border border-slate-200">
              <AddressForm autoEmail={autoEmail} />
            </div>
          </Reveal>
        </div>
      </section>
    );

    const HomePage = ({ autoEmail, onNavigate }) => {
      const { media, status } = useDriveMedia();
      const [peopleCount, setPeopleCount] = useState(0);

      useEffect(() => {
        fetch(`${APPS_SCRIPT_URL}?action=getBillsData`)
          .then((res) => res.json())
          .then((data) => setPeopleCount((data.participants || []).length))
          .catch(() => {});
      }, []);

      const photos = media.filter((m) => m.type === 'image');
      const videos = media.filter((m) => m.type === 'video');

      return (
        <div>
          <HeroSlideshow photos={photos} status={status} />
          <GallerySection media={media} status={status} />
          <RecapSection peopleCount={peopleCount} photoCount={photos.length} videoCount={videos.length} onNavigate={onNavigate} />
          <AddressSection autoEmail={autoEmail} />
        </div>
      );
    };

    // --- Main App Layout ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('address');
      const [autoEmail, setAutoEmail] = useState('');
      const [isAdmin, setIsAdmin] = useState(false);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const emailFromParam = params.get('email');
        if (emailFromParam) {
          setAutoEmail(emailFromParam.toLowerCase());
        } else {
          setAutoEmail("23005076@siswa.um.edu.my");
        }

        if (params.get('admin') === 'true') {
          setIsAdmin(true);
        }
      }, []);

      const toggleAdmin = () => {
        if (isAdmin) {
          setIsAdmin(false);
        } else {
          const pin = prompt("Enter Admin PIN to edit website:");
          if (pin === ADMIN_PIN) {
            setIsAdmin(true);
          } else if (pin !== null) {
            alert("Incorrect PIN!");
          }
        }
      };

      const navTabs = [
        { id: 'address', label: 'Home' },
        { id: 'agenda', label: 'Agenda' },
        { id: 'transport', label: 'Transportation' },
        { id: 'bills', label: 'Receipts and Bills' },
        { id: 'common', label: 'Common Info' }
      ];

      // Header is see-through over the Home slideshow, and turns solid once you scroll
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const goToTab = (id) => {
        setActiveTab(id);
        window.scrollTo(0, 0);
      };

      const isHome = activeTab === 'address';
      const onDark = isHome && !scrolled;

      const header = (
        <header className={`fixed top-0 inset-x-0 z-50 transition-all duration-300 ${onDark ? 'bg-transparent' : 'bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm'}`}>
          <div className="max-w-7xl mx-auto px-4 md:px-12 py-3 flex items-center gap-3">
            <button type="button" onClick={() => goToTab('address')} className={`shrink-0 text-lg md:text-xl font-extrabold tracking-tight ${onDark ? 'text-white' : 'text-slate-900'}`}>
              Ehbnb<span className={onDark ? 'text-[#f7f301]' : 'text-[#002ce2]'}>.com</span>
            </button>
            {isAdmin && (
              <span className="hidden sm:inline-block shrink-0 bg-amber-100 text-amber-800 border border-amber-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase">
                Admin
              </span>
            )}

            <nav className="nav-scroll flex-1 flex items-center justify-start md:justify-end gap-1 md:gap-2 overflow-x-auto whitespace-nowrap">
              {navTabs.map((tab) => {
                const active = activeTab === tab.id;
                const cls = onDark
                  ? (active ? 'bg-white text-slate-900' : 'text-white/85 hover:text-white hover:bg-white/15')
                  : (active ? 'bg-[#002ce2] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100');
                return (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => goToTab(tab.id)}
                    className={`shrink-0 text-xs md:text-sm font-semibold px-3 md:px-3.5 py-2 rounded-full transition-all ${cls}`}
                  >
                    {tab.label}
                  </button>
                );
              })}

              <button
                type="button"
                onClick={toggleAdmin}
                className={`shrink-0 text-xs font-semibold px-3 py-2 rounded-full transition-all border ${
                  isAdmin
                    ? 'bg-amber-50 text-amber-800 border-amber-300 hover:bg-amber-100'
                    : (onDark ? 'text-white/85 border-white/30 hover:bg-white/15' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200')
                }`}
                title="Toggle Admin Edit Mode"
              >
                {isAdmin ? '🔓 Lock' : '🔒 Admin'}
              </button>
            </nav>
          </div>
        </header>
      );

      const footer = (
        <footer className="bg-[#070a17] text-white px-5 md:px-12 py-12">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-end md:justify-between gap-6">
            <div>
              <p className="text-4xl md:text-6xl font-extrabold tracking-tighter">Ehbnb<span className="text-[#f7f301]">.com</span></p>
              <p className="mt-2 text-sm text-white/60">You go, I go · 4Balance Homestay Sri Petaling</p>
            </div>
            <a href={DRIVE_FOLDER_URL} target="_blank" rel="noopener noreferrer" className="self-start md:self-auto text-sm font-bold border border-white/30 rounded-full px-5 py-2.5 hover:bg-white hover:text-slate-900 transition">
              📁 Trip photo folder →
            </a>
          </div>
        </footer>
      );

      if (isHome) {
        return (
          <div className="min-h-screen bg-[#070a17]">
            {header}
            <HomePage autoEmail={autoEmail} onNavigate={goToTab} />
            {footer}
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {header}
        <div class="flex-1 flex flex-col justify-between relative z-10 px-6 pt-24 pb-10 max-w-7xl mx-auto w-full">
          <main class="w-full max-w-4xl mx-auto py-4">
            <div>
              <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-xl relative overflow-hidden">
                <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-200">
                  <div class="flex gap-2">
                    <span class="w-3 h-3 rounded-full bg-[#f7f301] border border-slate-900"></span>
                    <span class="w-3 h-3 rounded-full bg-[#002ce2]"></span>
                    <span class="w-3 h-3 rounded-full bg-slate-200"></span>
                  </div>
                  <span class="text-[10px] font-mono font-semibold text-slate-400 uppercase tracking-widest">Ehbnb Dashboard</span>
                </div>

                {activeTab === 'agenda' && <AgendaView />}
                {activeTab === 'transport' && <TransportView isAdmin={isAdmin} />}
                {activeTab === 'bills' && <BillsView isAdmin={isAdmin} />}
                {activeTab === 'common' && <CommonView />}
              </div>
            </div>
          </main>
        </div>
          {footer}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
